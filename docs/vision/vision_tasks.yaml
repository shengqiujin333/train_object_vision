items:
  - "模型能力描述与就绪探测：实现按 ai_profile 加载配置登记的 RKNN 模型（模型路径/名称来自配置，不写死），并用 rknn_query 读取输入/输出张量数量、形状布局、量化参数与运行时版本，与后处理期望逐项匹配通过后才置 ready；模型缺失或张量数量/形状/量化不匹配时返回 unavailable + 稳定 reason（MODEL_MISMATCH/NOT_READY），不得只按文件名判断。用户可观察：夹具张量描述下的匹配/不匹配两条路径在 --selftest 中确定可复现，探针与 P5 能读到每路 model_version 与不可用原因。"
  - "帧租约消费与预处理：真实检测器从 media::FrameLease/FrameDescriptor 取像素（NV12 走已有 librga 转 BGR，BGR→RGB 仅在适配器内显式转换），按 letterbox 等比缩放到 640×640 并记录 scale/pad_x/pad_y，按输入张量 dtype 与 scale/zero_point 写量化值；禁止从 FrameRef 元数据推导像素、禁止复用显示缓冲裸地址或已 unmap 地址。用户可观察：已知合成图与带 padding 的 NV12 输入下，预处理输出尺寸、归一化范围与 letterbox 参数正确，非法格式/stride/尺寸返回显式错误而不静默丢帧。"
  - "人形检测后处理（yolov5s COCO）：实现三尺度 YOLOv5 头解码、置信度过滤、NMS（阈值来自配置，不写死历史常量）、letterbox 逆变换到原图并归一化为 x/y/w/h，且 x,y∈[0,1]、x+w≤1、y+h≤1；只保留白名单类别 person（cls_id==0），其余类别丢弃并可计数。用户可观察：夹具张量下 person 框数量/坐标/置信度确定可复现，非 person 类不进入结果，空图产生空框而非错误。"
  - "轨道分割后处理（yolov8s-seg 13 输出）：实现分割头解码（三个尺度各 box/score/score_sum/seg 系数张量 + 1 个 proto 张量），按 per-box 系数与 proto 点积生成掩码、阈值化、逆 letterbox 到原图坐标，输出原图尺寸独立二值 plane（0/非零，stride 与所有权符合帧契约）并与 rail 框/分数一一对应；张量数量或形状与期望不符时显式返回 MODEL_MISMATCH。用户可观察：夹具张量下掩码尺寸等于原图且坐标与上屏一致、阈值化为二值、每个框有对应掩码，数量不符的场景返回显式模型不匹配。"
  - "同帧两阶段判定（front）：以同一 FrameDescriptor 身份（session_id/generation/seq）在同一帧内运行分割与人员检测，人员框中心点落在 rail 掩码内时置 in_roi=true 与 person 语义，配置 danger_zone 时再与 roi.yaml 求交；禁止把跨帧/跨 generation 缓存作为实时报警依据（如启用缓存必须登记最大年龄与失配策略且默认关闭）。用户可观察：同帧命中判定可复现，旧 generation/乱序帧被拒绝，分割失败或掩码为空时不输出轨道内安全结论而是标记不可用。"
  - "结果关联与发布（InferenceEnvelope）：产出携带 (session_id,camera_id,generation,seq) 关联键、capture_mono_us/result_mono_us、latency_ms（完成减接收且含排队）、availability(ready|unavailable)+reason、model_version、带 track_id 的 boxes 与掩码引用的结果；拒绝旧 session/generation、重复 seq、乱序结果并分别计数；结果队列有界、超载丢最旧并计数。用户可观察：陈旧/重复/乱序结果被丢弃且有计数，AI 不可用时返回 unavailable+reason+空框，空框与不可用两种语义在输出上可区分。"
  - "语义适配与规则接入（front）：把推理结果按受支持标签白名单严格映射为 core::Detection 并交给 RuleEngine，未知 label 被拦截；同帧多目标先聚合再按稳定 track 排序，禁止用 track_id=0 冒充同一目标；generation 变化或失帧时通过受控接口清理确认与跟踪状态，不整路误清无关目标。用户可观察：注入未知 label 不产生报警，多目标命中不重复开事件，跨 generation 不复用旧确认状态。"
  - "跟踪与多帧确认协同：在无专用跟踪模型时提供显式且可验证的相机级目标关联策略，或接入轻量跟踪，使 RuleEngine 的 (camera,type,track_id) 抑制与多帧确认可用；跟踪不可用时明确 track_id=null 并走相机级事件适配路径，禁止把所有目标映射为 track_id=0。用户可观察：同一目标连续命中只更新同一事件且不重复开新事件，不同目标互不清除对方确认，重连后旧目标状态被清理。"
  - "真实检测器接入推理工作线程与调度：以真实 Detector 替换 SimDetector 接入 AiWorker 与 ai_dispatcher 派发的带身份有界丢旧队列，生产模式关闭自造帧 tick，infer 不持调度锁阻塞 submit/状态快照/stop；按 plan_inference 的路数预算与温度守卫调度并记录实测温度。用户可观察：真实取流→派发→推理→结果发布链路贯通（可先用 file/test 源验证），停止后 AI 不可用语义成立，调度预算与温度守卫生效且不被单次 infer 阻塞。"
  - "其它职责可用性语义（pantograph/wheel_rail/cab_door）：为无专用模型证据的职责实现适配器入口，明确返回 unavailable + reason（UNSUPPORTED/MODEL_MISMATCH）并输出语义 unknown，绝不把 unknown 映射为 normal，也绝不因配置登记了模型名就宣称具备识别能力；仅当提供并核验了声明能力的专用模型后才置 ready。用户可观察：三职责在无专用模型时全部不可用且状态为 unknown，提供能力匹配模型后按声明能力转为可用。"
  - "距离测量（可选后置）：仅在提供相机标定（含变焦档位，如前方相机像素每米标定）时由人员框像素高度换算 distance_m，未标定或变焦未知时保持 -1，不用框尺寸臆造米值，且不假设规则消费该字段。用户可观察：有标定时输出与换算公式一致，无标定时 distance_m 为 -1 并在调试视图显示为未知而非 0。"
  - "AI 调试视图数据与掩码叠加：为 P5 提供每路 model_version/available/unavailableReason/fps/latencyMs/最近结果/置信度/距离/boxes/ROI，以及仅在掩码真实可用时提供掩码叠加数据；叠加层四开关默认关闭，司机角色不显示 AI 调试。用户可观察：无模型时显式显示不可用原因，掩码叠加只在真实掩码可用时出现，未知数值不格式化为 0。"
  - "无相机自检与可归档夹具证据：提供 --selftest 与文件源夹具（合成/已知图像到期望框、掩码与判定），覆盖模型缺省、张量不匹配、空帧、无检测、陈旧结果、AI 不可用等路径，并输出结构化 JSON。用户可观察：无设备条件下各后处理与可用性路径可复现判定并归档，真机精度与人工视觉确认单独标注为待执行而不由本增量声称通过。"
