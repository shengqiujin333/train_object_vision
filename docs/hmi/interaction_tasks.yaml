items:
  - "冻结平台判定与摄像头注册契约：明确 HMI 为 RK3588 本地桌面应用（非 Web），并产出配置驱动的六路摄像头注册表（id/位置/RTSP/是否启用AI），使三联视图、全摄像头页与报警来源均可由配置驱动，改配置不需改界面代码，产出可被视觉设计与桌面应用设计引用。"
  - "登记各摄像头检测职责与本期范围：为 CAM-01..CAM-06 写入检测职责（前方障碍/人员、左右仅大视野不检测、车顶受电弓三状态、车底轮轨关系、司机室车门），明确本期只接入 6 路可见光、不接入红外，模式相关需求（MODE-001..004/PTZ-004/FWD-008）按“仅可见光/未接入”中性呈现且不提供可交互控件，产出供实现按 ai_profile 驱动的职责表。"
  - "定义全局信息架构与导航：确定实时监控、报警中心、历史录像、全摄像头、AI调试、设备维护六个页面的入口、返回路径与角色可见性矩阵，要求司机默认进入实时监控且不渲染 AI调试/配置入口，受限页直接访问时显示无权限说明而非空白。"
  - "定义实时监控三联布局与响应式规则：规定左-前-右连续排列、前方画面面积最大、1920x1080 与 1280x720 两档下 P0 元素不滚动即可见，并规定一级前方报警时前方画面中央可视区不被弹窗或横幅完全遮挡，产出可检验布局约束。"
  - "定义关键状态区与顶部实时模式信息条：覆盖受电弓、轮轨、车门、摄像头连接、AI运行、录像、存储七类状态，正常时简洁、异常时突出，且每个状态同时以颜色、图标形状和文字三重编码，产出各状态取值与显示规则表。"
  - "定义报警交互规范：明确一级红/二级橙/三级黄的颜色与形状、是否有声音、默认动作，规定报警内容至少含类型/时间/摄像头/级别/描述，确认只改处理状态不删事件，一级报警持续到确认为止，同目标在抑制窗口内不重复刷屏并更新同一事件。"
  - "定义异常自动弹出与优先级规则：车顶受电弓、车底轮轨、车门异常时弹出对应摄像头预览并允许关闭或进入详情，规定同一时刻最多一个自动弹窗且不遮挡前方主画面，前方一级报警优先于该弹窗。"
  - "定义报警中心页面规格：列表字段含级别/类型/时间/来源摄像头/描述/处理状态/录像可用性，默认按级别降序再时间降序，提供确认、批量确认、查看录像、查看快照，并支持按日期、时间段、摄像头、类型、级别、确认状态筛选，产出空态与清除筛选交互。"
  - "定义历史录像与回放规格：时间轴以显著颜色标记报警区段，提供跳到报警前30秒、报警时刻、报警后30秒、报警后60秒四个动作，前方报警默认左/前/右三路同一时间轴同步回放，展示关键帧缩略图与事件详情侧栏，录像缺口显式标记且录像不可用时事件明确标注。"
  - "定义全摄像头页与设备维护页规格：六路同屏并各自显示连接状态、FPS、最近一帧时间；设备维护页覆盖摄像头在线/码流/冻结/质量、AI状态与模型版本与FPS、录像进程与剩余容量、网络与温度、云台Pan/Tilt/Zoom与容差校验及一键归位/重调预置位、重连与维护日志，断流格子保持位置不重排。"
  - "定义 AI 调试页与司机视图隔离：展示检测框、轨道ROI、置信度、距离、帧率、端到端延迟、模型版本与最近结果时间，支持调试叠加层开关，规定调试信息默认不进入司机主界面且司机角色不可见本页。"
  - "定义摄像头与数据状态模型及异常恢复：给出连接中/在线/画面冻结/离线/重连中/降级六态状态机及显示规则，硬性要求非在线状态禁止把旧帧当作实时画面并显示最近帧时间戳，并规定断电重启后自动恢复摄像头、录像、AI与云台前方预置位。"
  - "定义权限与可访问性约束：给出司机/维护/研发调试/管理员对六个页面与录像导出的权限矩阵，配置修改与导出需二次确认并写维护日志；规定对比度、颜色非唯一编码、闪烁不超过3Hz、触控目标不小于44px、键盘焦点顺序与一级报警不可静音为无视觉。"
  - "产出交互线框/原型并完成可用性走查与设计交接：基于本交互方案制作六个页面的线框与关键流程原型，记录专家走查发现并与用户研究明确区分，向视觉设计交付状态与规范输入、向桌面应用设计与实现交付状态矩阵与字段契约。"
  - "定义 NVR 设备与录像来源交互：把已登记的 NVR（192.168.1.4）纳入设备维护页，显示已登记/未配置/可达状态，账户、协议与 6 路通道映射未提供时显示“未配置”且不提供自动修改 NVR 配置的入口；回放页录像来源按配置在本地与 NVR 间选择，产出 NVR 字段契约与未配置态显示规则。"
