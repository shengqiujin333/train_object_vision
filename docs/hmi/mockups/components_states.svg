<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <title>组件与状态总览（视觉示意，非运行截图）</title>
  <rect width="1920" height="1080" fill="#0E1116"/>
  <text x="64" y="72" fill="#E6EDF3" font-size="24" font-weight="bold">组件与状态总览</text>
  <text x="64" y="104" fill="#9BA7B4" font-size="15">所有颜色/字号/间距取自 docs/hmi/design_tokens.yaml；交互态含 default / hover / pressed / focus / disabled</text>

  <!-- Buttons -->
  <text x="64" y="164" fill="#E6EDF3" font-size="18" font-weight="bold">按钮</text>
  <g>
    <rect x="64" y="184" width="160" height="44" rx="6" fill="#3B82F6"/><text x="144" y="212" fill="#FFFFFF" font-size="16" text-anchor="middle">主操作</text>
    <rect x="240" y="184" width="160" height="44" rx="6" fill="none" stroke="#3A4552"/><text x="320" y="212" fill="#E6EDF3" font-size="16" text-anchor="middle">次要</text>
    <rect x="416" y="184" width="160" height="44" rx="6" fill="#C42B1C"/><text x="496" y="212" fill="#FFFFFF" font-size="16" text-anchor="middle">危险</text>
    <rect x="592" y="184" width="160" height="44" rx="6" fill="none"/><text x="672" y="212" fill="#79B8FF" font-size="16" text-anchor="middle">幽灵</text>
    <rect x="768" y="184" width="160" height="44" rx="6" fill="#1B2027"/><text x="848" y="212" fill="#4C5764" font-size="16" text-anchor="middle">禁用</text>
    <!-- focus -->
    <rect x="944" y="182" width="164" height="48" rx="8" fill="none" stroke="#58A6FF" stroke-width="4" opacity="0.5"/>
    <rect x="946" y="184" width="160" height="44" rx="6" fill="#3B82F6"/><text x="1026" y="212" fill="#FFFFFF" font-size="16" text-anchor="middle">焦点态</text>
  </g>

  <!-- Status chips -->
  <text x="64" y="284" fill="#E6EDF3" font-size="18" font-weight="bold">状态徽标（形状+文字+颜色）</text>
  <g font-size="13">
    <rect x="64" y="304" width="110" height="32" rx="4" fill="#12261A"/><circle cx="82" cy="320" r="5" fill="#3FB950"/><text x="96" y="325" fill="#3FB950">在线</text>
    <rect x="186" y="304" width="120" height="32" rx="4" fill="#12203A"/><text x="202" y="325" fill="#4C9AFF">◌ 连接中</text>
    <rect x="318" y="304" width="132" height="32" rx="4" fill="#12203A"/><text x="334" y="325" fill="#4C9AFF">◌ 重连中·2</text>
    <rect x="462" y="304" width="120" height="32" rx="4" fill="#2A2312"/><text x="478" y="325" fill="#E3B341">❄ 画面冻结</text>
    <rect x="594" y="304" width="132" height="32" rx="4" fill="#2A2312"/><text x="610" y="325" fill="#E3B341">⚠ 画面降级</text>
    <rect x="738" y="304" width="100" height="32" rx="4" fill="#331114"/><text x="754" y="325" fill="#FF6B6B">⊘ 离线</text>
    <rect x="850" y="304" width="100" height="32" rx="4" fill="#1B2027"/><text x="866" y="325" fill="#8B949E">— 未知</text>
  </g>

  <!-- Alarm chips -->
  <text x="64" y="392" fill="#E6EDF3" font-size="18" font-weight="bold">报警级别徽标</text>
  <g font-size="14">
    <rect x="64" y="412" width="110" height="36" rx="4" fill="#C42B1C"/><text x="119" y="436" fill="#FFFFFF" text-anchor="middle">▲ 一级</text>
    <rect x="186" y="412" width="110" height="36" rx="4" fill="#B45309"/><text x="241" y="436" fill="#FFFFFF" text-anchor="middle">● 二级</text>
    <rect x="308" y="412" width="110" height="36" rx="4" fill="#8A6D00"/><text x="363" y="436" fill="#FFFFFF" text-anchor="middle">◆ 三级</text>
    <rect x="430" y="412" width="160" height="36" rx="4" fill="#3A1518" stroke="#FF6B6B" stroke-width="3"/><text x="510" y="436" fill="#FF6B6B" text-anchor="middle">▲ 一级（卡片）</text>
    <rect x="602" y="412" width="180" height="36" rx="4" fill="#2A2312"/><text x="692" y="436" fill="#E3B341" text-anchor="middle">⚠ 录像不可用</text>
  </g>
  <text x="64" y="474" fill="#6E7A88" font-size="13">灰度化后仍可由字形（▲/●/◆）与文字区分级别；颜色仅为强化。</text>

  <!-- Toggle / checkbox / radio -->
  <text x="64" y="534" fill="#E6EDF3" font-size="18" font-weight="bold">开关 / 复选 / 单选</text>
  <g>
    <rect x="64" y="554" width="56" height="30" rx="15" fill="#3B82F6"/><circle cx="105" cy="569" r="12" fill="#FFFFFF"/><text x="132" y="575" fill="#E6EDF3" font-size="14">开</text>
    <rect x="200" y="554" width="56" height="30" rx="15" fill="#2D3644"/><circle cx="215" cy="569" r="12" fill="#9BA7B4"/><text x="268" y="575" fill="#9BA7B4" font-size="14">关</text>
    <rect x="340" y="556" width="24" height="24" rx="4" fill="#3B82F6"/><text x="352" y="574" fill="#FFFFFF" font-size="16" text-anchor="middle">✓</text><text x="374" y="575" fill="#E6EDF3" font-size="14">已选</text>
    <rect x="480" y="556" width="24" height="24" rx="4" fill="none" stroke="#3A4552"/><text x="514" y="575" fill="#9BA7B4" font-size="14">未选</text>
    <circle cx="620" cy="568" r="11" fill="none" stroke="#3B82F6" stroke-width="2"/><circle cx="620" cy="568" r="5" fill="#3B82F6"/><text x="642" y="575" fill="#E6EDF3" font-size="14">单选</text>
  </g>

  <!-- Empty / loading / error / recovery -->
  <text x="64" y="650" fill="#E6EDF3" font-size="18" font-weight="bold">空 / 加载 / 失败 / 恢复</text>
  <rect x="64" y="670" width="300" height="180" rx="8" fill="#161B22" stroke="#2D3644"/>
  <text x="214" y="740" fill="#6E7A88" font-size="34" text-anchor="middle">🗂</text>
  <text x="214" y="776" fill="#9BA7B4" font-size="14" text-anchor="middle">暂无报警</text>
  <rect x="154" y="796" width="120" height="32" rx="6" fill="#3B82F6"/><text x="214" y="817" fill="#FFFFFF" font-size="13" text-anchor="middle">返回实时</text>

  <rect x="388" y="670" width="300" height="180" rx="8" fill="#161B22" stroke="#2D3644"/>
  <rect x="412" y="706" width="252" height="14" rx="7" fill="#232B36"/>
  <rect x="412" y="734" width="200" height="14" rx="7" fill="#232B36"/>
  <rect x="412" y="762" width="230" height="14" rx="7" fill="#232B36"/>
  <text x="538" y="822" fill="#6E7A88" font-size="13" text-anchor="middle">加载中（骨架）</text>

  <rect x="712" y="670" width="300" height="180" rx="8" fill="#331114" stroke="#E5484D"/>
  <text x="862" y="742" fill="#FF6B6B" font-size="34" text-anchor="middle">⚠</text>
  <text x="862" y="776" fill="#FF6B6B" font-size="14" text-anchor="middle">视频流不可用</text>
  <rect x="802" y="796" width="120" height="32" rx="6" fill="none" stroke="#FF6B6B" stroke-width="2"/><text x="862" y="817" fill="#FF6B6B" font-size="13" text-anchor="middle">重试</text>

  <rect x="1036" y="670" width="300" height="180" rx="8" fill="#12261A" stroke="#3FB950"/>
  <text x="1186" y="742" fill="#3FB950" font-size="34" text-anchor="middle">✓</text>
  <text x="1186" y="776" fill="#3FB950" font-size="14" text-anchor="middle">已恢复：右侧 CAM-03</text>
  <text x="1186" y="802" fill="#6E7A88" font-size="12" text-anchor="middle">3s 后自动消失，不打断驾驶</text>

  <!-- Timeline mini -->
  <text x="64" y="908" fill="#E6EDF3" font-size="18" font-weight="bold">时间轴片段</text>
  <rect x="64" y="928" width="1272" height="72" rx="8" fill="#161B22" stroke="#2D3644"/>
  <rect x="84" y="950" width="1232" height="20" rx="4" fill="#1F2630"/>
  <rect x="84" y="950" width="760" height="20" rx="4" fill="#25406B"/>
  <rect x="844" y="946" width="120" height="28" rx="4" fill="#3A1518" stroke="#FF6B6B" stroke-width="3"/><text x="904" y="966" fill="#FF6B6B" font-size="12" text-anchor="middle">▲ 一级</text>
  <rect x="1000" y="950" width="80" height="20" fill="#0E1116"/>
  <line x1="904" y1="938" x2="904" y2="982" stroke="#FFFFFF" stroke-width="2"/>
  <text x="84" y="992" fill="#6E7A88" font-size="12">连续录像</text><text x="180" y="992" fill="#6E7A88" font-size="12">|</text><text x="196" y="992" fill="#FF6B6B" font-size="12">报警区段</text><text x="300" y="992" fill="#6E7A88" font-size="12">|</text><text x="316" y="992" fill="#E3B341" font-size="12">斜纹 = 录像缺失</text>

  <!-- keyboard hint -->
  <text x="64" y="1046" fill="#4C5764" font-size="12">键盘：Tab 依次聚焦，Enter 激活，Esc 关闭弹窗；焦点环 2px #58A6FF 始终可见。本图为视觉示意，非运行截图。</text>
</svg>
