  <text x="104" y="1040" fill="#4C5764" font-size="12">视觉示意（手绘 SVG 线框，非运行截图） · 一级报警常驻至确认 · 横幅不覆盖前方画面中央区 · 颜色+形状▲+文字三重编码</text>
