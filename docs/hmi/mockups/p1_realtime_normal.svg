  <circle cx="830" cy="24" r="6" fill="#3FB950"/>
  <text x="846" y="30" fill="#9BA7B4" font-size="15">AI:就绪</text>
  <circle cx="950" cy="24" r="6" fill="#3FB950"/>
  <text x="966" y="30" fill="#9BA7B4" font-size="15">系统健康:正常</text>

  <!-- Left navigation -->
  <rect x="0" y="48" width="88" height="1032" fill="#161B22"/>
  <line x1="88" y1="48" x2="88" y2="1080" stroke="#2D3644"/>
  <rect x="0" y="64" width="4" height="72" fill="#3B82F6"/>
  <rect x="20" y="80" width="48" height="32" rx="6" fill="#1F2630"/><text x="44" y="104" fill="#3B82F6" font-size="16" text-anchor="middle">▣</text>
  <text x="44" y="128" fill="#E6EDF3" font-size="12" text-anchor="middle">实时</text>
  <text x="44" y="196" fill="#9BA7B4" font-size="14" text-anchor="middle">🔔</text><text x="44" y="216" fill="#9BA7B4" font-size="12" text-anchor="middle">报警</text>
  <text x="44" y="284" fill="#9BA7B4" font-size="14" text-anchor="middle">⟲</text><text x="44" y="304" fill="#9BA7B4" font-size="12" text-anchor="middle">回放</text>
  <text x="44" y="372" fill="#9BA7B4" font-size="14" text-anchor="middle">⊞</text><text x="44" y="392" fill="#9BA7B4" font-size="12" text-anchor="middle">全摄</text>
