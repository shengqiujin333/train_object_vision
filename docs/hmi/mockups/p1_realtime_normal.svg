<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <title>P1 实时监控 — 正常态（视觉示意，非运行截图）</title>
  <rect width="1920" height="1080" fill="#0E1116"/>

  <!-- Top global status bar -->
  <rect x="0" y="0" width="1920" height="48" fill="#161B22"/>
  <line x1="0" y1="48" x2="1920" y2="48" stroke="#2D3644"/>
  <text x="24" y="30" fill="#E6EDF3" font-size="18" font-family="'Noto Sans Mono',monospace">2026-10-15 09:42:07</text>
  <circle cx="300" cy="24" r="6" fill="#3FB950"/>
  <text x="316" y="30" fill="#9BA7B4" font-size="15">车速 -- km/h</text>
  <text x="470" y="30" fill="#9BA7B4" font-size="15">成像模式</text>
  <rect x="548" y="10" width="72" height="28" rx="4" fill="#12203A"/>
  <text x="562" y="30" fill="#4C9AFF" font-size="14">可见光</text>
  <circle cx="700" cy="24" r="6" fill="#3FB950"/>
