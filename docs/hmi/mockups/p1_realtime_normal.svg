  <text x="579" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace">24.1 fps</text>
  <text x="1429" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace" text-anchor="end">09:42:07</text>

  <!-- right CAM-03 -->
  <rect x="1464" y="64" width="440" height="760" rx="8" fill="#0A0D11" stroke="#2D3644"/>
  <text x="1480" y="92" fill="#9BA7B4" font-size="14">右侧 CAM-03</text>
  <rect x="1850" y="76" width="40" height="22" rx="4" fill="#12261A"/><circle cx="1860" cy="87" r="4" fill="#3FB950"/><text x="1870" y="92" fill="#3FB950" font-size="12">在线</text>
  <text x="1480" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace">23.5 fps</text>
  <text x="1800" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace" text-anchor="end">09:42:07</text>

  <!-- status strip -->
  <rect x="104" y="840" width="1800" height="64" rx="8" fill="#161B22" stroke="#2D3644"/>
  <g font-size="13">
    <circle cx="136" cy="872" r="5" fill="#3FB950"/><text x="150" y="866" fill="#6E7A88" font-size="11">受电弓</text><text x="150" y="884" fill="#E6EDF3" font-size="13">正常接触</text>
    <circle cx="356" cy="872" r="5" fill="#3FB950"/><text x="370" y="866" fill="#6E7A88" font-size="11">轮轨</text><text x="370" y="884" fill="#E6EDF3" font-size="13">正常</text>
    <circle cx="546" cy="872" r="5" fill="#3FB950"/><text x="560" y="866" fill="#6E7A88" font-size="11">车门</text><text x="560" y="884" fill="#E6EDF3" font-size="13">关闭正常</text>
    <circle cx="726" cy="872" r="5" fill="#3FB950"/><text x="740" y="866" fill="#6E7A88" font-size="11">摄像头</text><text x="740" y="884" fill="#E6EDF3" font-size="13">6/6 在线</text>
    <circle cx="926" cy="872" r="5" fill="#3FB950"/><text x="940" y="866" fill="#6E7A88" font-size="11">AI</text><text x="940" y="884" fill="#E6EDF3" font-size="13">就绪</text>
    <circle cx="1086" cy="872" r="5" fill="#3FB950"/><text x="1100" y="866" fill="#6E7A88" font-size="11">录像</text><text x="1100" y="884" fill="#E6EDF3" font-size="13">运行中</text>
    <circle cx="1266" cy="872" r="5" fill="#3FB950"/><text x="1280" y="866" fill="#6E7A88" font-size="11">存储</text><text x="1280" y="884" fill="#E6EDF3" font-size="13">剩余 42%</text>
  </g>

  <!-- current alarm bar (empty state) -->
  <rect x="104" y="920" width="1800" height="80" rx="8" fill="#161B22" stroke="#2D3644"/>
  <text x="136" y="966" fill="#6E7A88" font-size="16">当前报警：暂无</text>
  <rect x="1660" y="940" width="220" height="44" rx="6" fill="none" stroke="#3A4552"/>
  <text x="1770" y="968" fill="#E6EDF3" font-size="16" text-anchor="middle">警报复览</text>

  <!-- annotation -->
  <text x="104" y="1040" fill="#4C5764" font-size="12">视觉示意（手绘 SVG 线框，非运行截图） · 参考 1920×1080 · 三联顺序 左-前-右，前方面积最大</text>
