  <text x="44" y="548" fill="#9BA7B4" font-size="14" text-anchor="middle">⚙</text><text x="44" y="568" fill="#9BA7B4" font-size="12" text-anchor="middle">维护</text>

  <!-- Triple view: left / front / right -->
  <!-- left CAM-02 -->
  <rect x="104" y="64" width="440" height="760" rx="8" fill="#0A0D11" stroke="#2D3644"/>
  <text x="120" y="92" fill="#9BA7B4" font-size="14">左侧 CAM-02</text>
  <rect x="490" y="76" width="40" height="22" rx="4" fill="#12261A"/><circle cx="500" cy="87" r="4" fill="#3FB950"/><text x="510" y="92" fill="#3FB950" font-size="12">在线</text>
  <text x="120" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace">23.8 fps</text>
  <text x="440" y="808" fill="#6E7A88" font-size="13" font-family="'Noto Sans Mono',monospace" text-anchor="end">09:42:07</text>

  <!-- front CAM-01 (largest) -->
  <rect x="559" y="64" width="890" height="760" rx="8" fill="#0A0D11" stroke="#3A4552" stroke-width="2"/>
