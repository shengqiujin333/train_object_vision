items:
  - "冻结目标构建依赖基线：按 DESKTOP_APP_DESIGN §3.4 在板端逐条核验 Qt5.15 与 xcb/eglfs 平台插件、gstreamer1.0-qt5(qmlglsink)、Mali EGL/GLES、mppvideodec/glupload/glcolorconvert、rgavideoconvert+librga、librknnrt 2.3.2、sqlite3、磁盘可用量，并记录每条命令的原始输出；对不可用项给出替代结论。用户可观察：新增 docs/hmi/build_env_check.md 中每条命令与真实结果，未执行的项显式标注未核验，不得把主机可运行当作板端可运行。"
  - "完成渲染路径选型 spike：在板端用一路 RTSP 实测 mppvideodec→glupload→glcolorconvert→qmlglsink 能否协商并显示，失败则实测 RGA NV12→BGR + Qt 纹理上传的回退路径，记录 fps、CPU/GPU 占用与画面色彩正确性。用户可观察：build_env_check.md 追加实测数据与选定的主/回退路径，后续所有渲染任务据此实现，不得在未实测前假定主路径成立。"
  - "建立桌面应用工程骨架与板端本机构建脚本：创建独立 CMake 工程（不改动 rknn_model_zoo 官方树），区分 target(aarch64 板端)与 preview(x86_64 模拟)两种构建开关，产出可执行文件。用户可观察：板端 ./build.sh Release 编译成功且二进制存在，Preview 构建亦成功；界面在无任何摄像头时可启动并显示明确的“无数据/未连接”空态后正常退出。依赖：任务1、任务2 的依赖结论与渲染选型。"
  - "实现设计令牌主题层：构建期由 docs/hmi/design_tokens.yaml 生成 tokens.json/Tokens.qml，运行时 Theme 单例提供颜色、字号、间距、圆角、z-index；QML 与组件中不出现硬编码色值/字号。用户可观察：修改 design_tokens.yaml 中任一颜色或字号并重新生成后，界面相应元素随之变化，且代码扫描无硬编码十六进制色值的界面文件。依赖：任务3。"
  - "实现应用外壳与角色化导航：单窗口、顶部全局状态条、六个页面（实时监控/报警中心/历史录像/全摄像头/AI调试/设备维护）固定导航与返回路径，按角色过滤渲染入口。用户可观察：以司机角色启动时 AI 调试与配置入口不渲染，直接导航到受限页显示无权限说明与返回而非空白；切换到维护角色后全部入口出现。依赖：任务4。"
  - "实现配置驱动的摄像头注册表：从 config/cameras.yaml 读取六路注册表（id/名称/位置/RTSP/UDP/ai_enabled/显示帧率），字段缺失或非法时给出明确错误并在设备维护页可见。用户可观察：增删或改名一路相机仅改配置不改代码即可反映到视图槽位与排序；删除必填字段时启动报出具体缺失项而非静默用默认值。依赖：任务3。"
  - "实现单路取流与流状态机：原生 GStreamer（强制 UDP）逐帧发布，维护 CONNECTING/LIVE/FROZEN/OFFLINE/RECONNECTING/DEGRADED 六态，统计 fps、最近帧时间、重连次数与质量标志（过暗/过曝/遮挡/模糊/绿色伪影）。用户可观察：断开某路相机后该路进入重连中并显示已重连次数与最近帧时间；非 LIVE 状态渲染占位层且旧帧不被当作实时画面显示。依赖：任务6。"
  - "实现视频渲染与实时监控页三联布局：把选定渲染路径接入 QML，实现左-前-右三联、前方面积最大，并在 1920x1080 与 1280x720 两档下 P0 元素（三联、关键状态区、当前报警条、顶部状态条）不滚动即可见；一级报警横幅不得完全遮挡前方中央可视区。用户可观察：两档分辨率下按 P0 元素截图核对，调整窗口尺寸时三联顺序与比例保持。依赖：任务2、任务7。"
  - "实现六路并发与全摄像头页：六路同时取流并在 2x3/3x2 网格显示，每格显示摄像头名、连接状态角标、实时 fps 与最近一帧时间；断流或冻结格子保留位置不重排。用户可观察：人为断开其中一路后该格显示占位与最近帧时间且其余五路继续刷新，网格不发生跳位。依赖：任务8。"
  - "实现关键状态区与顶部模式信息条：受电弓、轮轨、车门、摄像头、AI、录像、存储七类状态，正常简洁、异常突出，且每项同时以颜色、图标形状与文字三重编码；顶部显示时间、模式（可见光/红外/自动）、录像、AI 与系统健康，未接入项显示未接入。用户可观察：关闭颜色渲染或看黑白截图仍能通过形状与文字区分状态；点击异常项跳转到对应详情页或提示无权限。依赖：任务4、任务7。"
  - "接入推理服务并复用现有双模型：为 ai_enabled 的相机运行轨道分割与人形检测（librknnrt 2.3.2、现有后处理），在有界丢旧帧队列上按配置帧间隔推理，上报模型版本、推理 fps、最近结果时间与耗时；AI 退出或加载失败时状态转异常。用户可观察：AI 调试页显示检测框、轨道 ROI、置信度与耗时；停掉推理线程后状态区 AI 项与相关报警明确标注不可用而非静默。依赖：任务7。"
  - "实现报警规则与事件管理器：多帧确认、危险区（轨道 ROI）判定、跟踪 ID 与抑制窗口，级别映射严格按 PRD §8.2；确认只改处理状态不删除事件，一级报警持续到确认且声音停止后视觉仍在；每个事件保存快照与算法/模型版本/置信度/距离元数据并写入 SQLite。用户可观察：触发一次前方报警后事件出现在报警中心且状态为未确认，点击确认后行状态变化但事件仍可检索，快照与元数据可查看。依赖：任务11。"
  - "实现报警中心页面：列表字段含级别/类型/时间/来源摄像头/描述/处理状态/录像可用性，默认按级别降序再时间降序，支持确认、批量确认、查看录像、查看快照与按日期/时间段/摄像头/类型/级别/确认状态筛选；无结果显示空态与清除筛选。用户可观察：筛选组合后列表结果与空态正确，批量确认后各行状态即时更新并写维护日志。依赖：任务12。"
  - "实现本地报警保护片段与缺口记录：每路维护有界滚动缓冲，报警时固化报警前 30 秒与后 60 秒（可配置）为保护片段，采用先写临时文件再原子重命名，容量上限与保留策略来自配置；任何录像中断写入缺口记录。用户可观察：触发报警后保护片段文件存在且时长符合配置，删除或中断录像后事件与时间轴出现录像不可用标记而非静默。依赖：任务12。"
  - "实现历史回放页：日期与摄像头选择、时间轴（连续段、报警区段显著色标、缺口斜纹、游标、关键帧缩略图）、-30s/报警时刻/+30s/+60s 四个跳转、前方报警默认左/前/右同时间轴同步播放、事件详情侧栏（时间/类型/级别/距离/置信度/处理状态）。用户可观察：从报警卡进入后自动定位到报警时刻并锁定相关摄像头；三路同步播放的时间偏差可见；缺口显示留白或斜纹。依赖：任务13、任务14。"
  - "实现 AI 调试页与司机视图隔离：展示检测框、ROI、置信度、距离、帧率、端到端延迟、模型版本与最近结果时间，提供调试叠加层开关且默认关闭；司机角色不渲染本页与任何调试叠加。用户可观察：维护/研发角色可逐项开关叠加层；司机角色登录后主界面无检测框与参数，直接访问本页显示无权限。依赖：任务11。"
  - "实现设备维护页与云台能力：展示摄像头在线/码流/帧率/最近帧/质量、AI 状态、录像进程与剩余容量、网络错误计数与温度、云台 Pan/Tilt/Zoom 实际值与目标值及容差校验、重连入口，以及按日滚动的维护日志；提供一键归位与重新调用前方预置位并二次确认。用户可观察：调用归位/预置位后显示目标值与实际值及容差结果，失败显示容差超差并令前方 AI 转未就绪；操作结果写入维护日志。依赖：任务7、任务12、任务14。"
  - "实现权限与二次确认：给出司机/维护/研发/管理员的页面与导出权限矩阵并落到运行时校验，配置修改与录像导出需二次确认并写维护日志，受限入口不渲染。用户可观察：以司机角色尝试导出时入口不存在或显示无权限，以管理员导出时出现二次确认且完成后维护日志新增记录。依赖：任务5。"
  - "实现健康监控、结构日志与断电自恢复：周期采样 NPU 负载/CPU/温度/网络错误/磁盘并落库与上屏，日志按日滚动且可结构化查询；启动时按顺序恢复配置、数据库、录像、取流、AI、云台归位与前方预置位并在界面显示恢复进度。用户可观察：重启应用后各相机自动重连、AI 恢复、云台回到前方预置位，界面显示恢复步骤与完成状态；单路非关键相机异常不导致应用退出。依赖：任务7、任务11、任务17。"
  - "实现故障注入自检并完成打包部署：提供模拟断流、画面冻结、AI 退出、磁盘不足、云台超差的开关或脚本，产出可复现的观测证据；输出板端运行目录（bin/config/models/resources/data/logs）与 systemd 常驻自启、版本信息与升级回滚说明，资源与图标登记来源许可。用户可观察：按自检清单注入每种故障后界面出现对应显式提示与恢复路径，系统重启后应用随系统自动拉起并进入可用状态。依赖：任务15、任务17、任务19。"
