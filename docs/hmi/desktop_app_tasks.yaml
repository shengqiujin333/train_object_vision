items:
  - "冻结构建/运行依赖基线与授权缺口登记：按 DESKTOP_APP_DESIGN §3.3 逐条核验 E-01..E-13（板端授权可用时经 rk3588_inspect 有限等待执行；主机可执行部分在主机执行），每条命令保留真实输出与退出码；主机无 C/C++ 工具链、板端构建授权、相机/NVR 读取授权等缺口，按已核实可用/未核验/有证据的缺口三态如实登记，不得把主机结论当作板端结论。用户可观察：docs/hmi/build_env_check.md 更新为每条命令+真实结果或明确的未核验标注，且缺口有替代结论，不阻塞后续主机/core 增量。"
  - "完成渲染路径选型 spike（双路径保留，未实测不预设）：用 app/spikes/render_path 工具在板端真机（RTSP/UDP）或无相机时用 file/test 替代源实测 mppvideodec→glupload→glcolorconvert→qmlglsink 与 RGA NV12→BGR+Qt 纹理两条路径，记录 fps/CPU/GPU/色彩（BGR 三通道均值近似相等）。用户可观察：selection 结果写回 build_env_check.md §14；未取得板端授权时维持 UNMEASURED、默认 cpu、gl 为可开启候选，且双路径配置开关在源码中存在。"
  - "建立分层的 CMake 工程骨架与三档构建入口：拆分 railhmi-core（仅 C++ 标准库 + SQLite，无 Qt/GStreamer/相机）、railhmi-platform（SQLite/文件存储/日志）、railhmi-ui+media（target 专用 Qt/GStreamer），提供 target(aarch64 板端)、preview(x86_64 模拟)、CoreTests 三个构建开关与 build.sh。用户可观察：在具备对应工具链的环境下 CoreTests 与 Preview 编译成功、板端 target 编译成功并产出二进制；无工具链时构建脚本给出明确缺失依赖提示而非静默失败。"
  - "实现 railhmi-core 配置与状态契约层：加载并校验 cameras.yaml/app.yaml/thresholds.yaml/roi.yaml，字段缺失或非法时报出具体字段名，绝不静默用默认值；暴露交互方案 v2 §7.2 全部字段，含 ai_enabled、ai_profile、integration_state(probing/reachable/unreachable/unconfigured/unverified)、mode(visible/ir 未接入)、recording_source(local/nvr/both)。用户可观察：CoreTests 对合法/非法配置逐项断言，非法配置启动报出具体字段。"
  - "实现 railhmi-core 流状态机与质量判定：实现 CONNECTING/LIVE/FROZEN/OFFLINE/RECONNECTING/DEGRADED 六态、首帧/冻结/重连阈值退避、质量标志（过暗/过曝/遮挡/模糊）、达重连阈值升级设备事件、以及非 LIVE 禁止旧帧实时的判定接口。用户可观察：用模拟时钟驱动的单元测试覆盖全部六态与阈值升级转换，并能复现“断流→重连计数→达阈值升级”序列。"
  - "实现 railhmi-core 检测职责与报警规则/事件层：按 ai_profile(front/pantograph/wheel_rail/cab_door/none) 分派判定（前方危险区 ROI、受电弓三态持续确认、轮轨标定基准、车门 ROI），实现多帧确认、跟踪 ID 与抑制窗口，级别严格按 PRD §8.2 映射（前方人/物=1、轮轨=1、受电弓异常=2、车门未关严=2、前方主摄离线/冻结=2、侧视离线=3），确认只改 ack_state 不删除事件。用户可观察：CoreTests 注入每类事件断言级别一致，同 track_id 在窗口内不新增事件。"
  - "实现 railhmi-core 持久化与保留策略模型：SQLite（WAL）单写线程建表与读写 events/event_targets/maintenance_log/device_health/recording_segments/recording_gaps/stream_events/integrations/config_kv，统一 UTC 毫秒 + 单调微秒时间基准；实现保护片段优先、普通片段按容量/周期淘汰的保留策略与录像缺口记录模型。用户可观察：CoreTests 验证写入-重启-读取一致、WAL 恢复、保留淘汰顺序正确且缺口可查。"
  - "交付 railhmi-core 单元测试与可复现验证入口：tests/core 覆盖配置校验、六态状态机、规则/级别映射、抑制、持久化、保留策略，提供一条命令运行并输出可归档结果；测试入口在最小工具链（C++ 编译器 + SQLite）下即可运行，不依赖 Qt/GStreamer/相机。用户可观察：运行测试命令打印逐项通过/失败与退出码，测试文件可独立复现。"
  - "实现模拟输入与故障注入系统：提供模拟帧源、可重置的模拟检测序列（按 ai_profile 注入）与 FI-01..FI-05、FI-10 软件开关/CLI 参数（断流/冻结/AI 退出/磁盘不足/PTZ 超差/录像中断），无需相机即可驱动全部页面与状态。用户可观察：按脚本注入任一故障后应用进入对应状态且可恢复，注入参数与观测写入结构化日志。"
  - "实现设计令牌主题层：构建期由 docs/hmi/design_tokens.yaml 生成 tokens.json/Tokens.qml，运行时 Theme 单例提供颜色/字号/间距/圆角/z-index（含 alarm L1/L2/L3、stream_state、mode、integration_state、detection_badge）；QML 与 C++ UI 不出现硬编码色值/字号。用户可观察：改令牌中任一颜色或字号后重新生成并重启，界面元素随之变化，且静态扫描无硬编码十六进制色值。"
  - "实现应用外壳与角色化导航：单窗口、顶部全局状态条、六个页面（实时监控/报警中心/历史录像/全摄像头/AI调试/设备维护）固定导航与返回路径，按角色（司机/维护/研发/管理员）过滤渲染入口；顶部模式位固定显示可见光、红外未接入且无切换控件。用户可观察：司机角色启动时 AI 调试与配置入口不渲染，直达受限页显示无权限说明与返回；维护角色全部入口出现。"
  - "实现配置驱动摄像头注册表并接入 UI：从 cameras.yaml 读取六路注册表并渲染槽位与排序，显示位置名、连接状态、AI 检测职责徽标（DetectionBadge，仅 P4/P6，司机 P1 不显示），并登记 NVR 集成项（地址、已登记、状态、通道映射=未配置）。用户可观察：仅改配置增删/改名一路相机即改变视图槽位与徽标，删除必填字段启动报出具体缺失项。"
  - "实现单路取流与状态机接入：原生 GStreamer（强制 UDP）逐帧发布，接入 railhmi-core 六态与质量标志，统计 fps/最近帧时间/重连次数，并在无相机时可用 file/test 源运行同一管线。用户可观察：断流后该路进入重连中并显示已重连次数与最近帧时间，非 LIVE 状态渲染占位层且旧帧不被当作实时画面。"
  - "实现视频渲染与实时监控页三联布局：把配置选定的渲染路径（默认 cpu，gl 可开关）接入 QML，实现左-前-右三联且前方面积最大，在 1920x1080 与 1280x720 两档下 P0 元素（三联、关键状态区、当前报警条、顶部状态条）不滚动即可见，一级报警横幅不遮挡前方中央可视区。用户可观察：两档分辨率下按 P0 元素核对，调整窗口尺寸时三联顺序与比例保持。"
  - "实现六路并发与全摄像头页：六路同时取流并在 2x3/3x2 网格显示，每格显示摄像头名、连接状态角标、实时 fps、最近一帧时间与检测职责徽标；断流或冻结格子保留位置不重排。用户可观察：断开其中一路后该格显示占位与最近帧时间且其余五路继续刷新，网格不跳位。"
  - "实现关键状态区与顶部模式信息条：受电弓、轮轨、车门、摄像头、AI、录像、存储七类状态正常简洁、异常突出，且每项同时以颜色、图标形状、文字三重编码；顶部显示时间、可见光模式位与红外未接入、录像、AI、系统健康，未接入项（车速/门磁等）显示未接入。用户可观察：看黑白截图仍能通过形状与文字区分状态，点击异常项跳转对应详情或提示无权限。"
  - "接入推理服务并复用现有双模型：为 ai_enabled 的相机按 ai_profile 运行检测（前方障碍/人员、车顶受电弓三态、车底轮轨、司机室车门），在有界丢旧帧队列上按配置帧间隔推理，上报模型版本/推理 fps/最近结果时间/耗时，并按优先级与温度守卫调度；两侧广角不进入推理队列。用户可观察：AI 调试页显示检测框/ROI/置信度/耗时，停掉推理线程后状态区 AI 项与相关报警明确标注不可用而非静默。"
  - "实现报警中心页面：列表字段含级别/类型/时间/来源摄像头/描述/处理状态/录像可用性，默认按级别降序再时间降序，支持确认、批量确认、查看录像、查看快照与按日期/时间段/摄像头/类型/级别/确认状态筛选；录像不可用时行内显著标注。用户可观察：筛选组合后列表与空态正确，批量确认后各行状态即时更新并写维护日志。"
  - "实现本地报警保护片段与缺口记录：每路维护有界滚动缓冲，报警时固化报警前 30 秒与后 60 秒（可配置）为保护片段，先写临时文件再原子重命名，容量上限与保留策略来自配置并优先保留保护片段；任何录像中断写入缺口记录。用户可观察：触发报警后保护片段存在且时长符合配置，中断录像后事件与时间轴出现录像不可用标记而非静默。"
  - "实现历史回放页：日期与摄像头选择、时间轴（连续段、报警区段显著色标、缺口斜纹、游标、关键帧缩略图）、-30s/报警时刻/+30s/+60s 四个跳转、前方报警默认左/前/右同时间轴同步播放、事件详情侧栏（时间/类型/级别/距离/置信度/处理状态/备注）；NVR 录像来源不可用时显式标注并提供本机片段回放。用户可观察：从报警卡进入后自动定位报警时刻并锁定相关摄像头，三路同步偏差超出配置阈值时显示提示。"
  - "实现 AI 调试页与司机视图隔离：展示检测框、ROI、置信度、距离、帧率、端到端延迟、模型版本与最近结果时间，提供调试叠加层开关且默认关闭，调试描边使用独立高对比色避免与报警红混淆；司机角色不渲染本页与任何叠加。用户可观察：维护/研发角色可逐项开关叠加层，司机登录后主界面无检测框与参数，直达本页显示无权限。"
  - "实现设备维护页：展示摄像头在线/码流/帧率/最近帧/质量、AI 状态与模型版本、录像进程与剩余容量、网络错误计数与温度、云台 Pan/Tilt/Zoom 实际值与目标值及容差校验、重连入口与按日滚动的维护日志；NVR 以设备卡显示登记/可达/未配置状态与通道映射（未提供时显示未配置，不虚构通道号，不提供自动修改入口）；提供一键归位与重新调用前方预置位并二次确认。用户可观察：调用归位/预置位后显示目标值与实际值及容差结果，超差显示失败并令前方 AI 未就绪，操作写入维护日志。"
  - "实现权限与二次确认：给出司机/维护/研发/管理员的页面与导出权限矩阵并落到运行时校验，配置修改与录像导出需二次确认并写维护日志，受限入口不渲染。用户可观察：司机角色导出入口不存在或显示无权限，管理员导出出现二次确认且完成后维护日志新增记录。"
  - "实现健康监控、结构化日志与断电自恢复：周期采样 NPU 负载/CPU/温度/网络错误/磁盘并落库与上屏，日志按日滚动且可结构化查询；启动时按顺序恢复配置、数据库、录像、取流、AI、云台归位与前方预置位并在界面显示恢复进度。用户可观察：重启应用后各相机自动重连、AI 恢复、云台回到前方预置位且界面显示恢复步骤与完成状态，单路非关键相机异常不导致应用退出。"
  - "完成目标运行包打包、systemd 常驻自启与故障自检自证：输出板端运行目录（bin/config/models/resources/data/logs）与 systemd 单元（Restart=always、DISPLAY、不修改 cpu-performance.service），提供版本信息与升级回滚说明，资源与图标登记来源许可；用模拟输入与 FI 开关产出每种故障的显式提示与恢复路径证据。用户可观察：按自检清单注入故障后界面出现对应显式提示与恢复路径，系统重启后应用随系统自动拉起并进入可用状态。"
