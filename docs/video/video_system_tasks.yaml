items:
  - "视频源能力探测与配置绑定：从 cameras.yaml/app.yaml/thresholds.yaml 加载六路 RTSP 登记项（URL 不含凭据、凭据经 credential_env 环境变量在进程内读取），在接入前用直接 gst-inspect-1.0 <element> 判定 rtspsrc/decodebin/mppvideodec/appsink/tee/queue 等元素可用性并记录 GStreamer/librga/librknnrt 版本，绝不依赖 gst-inspect-1.0 --exists 退出码；把协商得到或待实测的 codec/分辨率/fps/colorimetry 作为能力记录，不写死文档预期。用户可观察：缺凭据时该路明确返回 CREDENTIAL_MISSING，元素缺失时明确报缺哪个元素，能力记录随路输出且不含任何凭据。"
  - "单路取流管线工厂：实现 rtsp(强制 protocols=udp)/file/test 三类源复用同一条管线，统一在解码后进入 video/x-raw,format=NV12；默认 decodebin 自适应 H.264/H.265，并保留可配置的显式 rtph264depay/rtph265depay+h26xparse+mppvideodec 固化路径；rtspsrc 采用配置的 latency/timeout/udp-buffer-size 并以认证属性而非拼接串传入凭据；日志与错误消息整条脱敏。用户可观察：rtsp 路径可启动并在有源时出帧，无相机时 file/test 源走同一代码路径出帧，pipeline/bus 原文不进入日志。"
  - "帧身份与跨重连代际：为每帧生成 (session_id,camera_id,generation,seq) 身份与 capture_mono_us/capture_wall_ms/pts_ns，generation 仅在会话真正重建时递增，seq 在同一 generation 内严格递增；提供消费者侧拒绝旧 session/generation、重复 seq、乱序结果的判定。用户可观察：跨一次重建后旧 generation 的帧被拒绝，重复/乱序 seq 被识别，时间戳单位与来源符合接口契约（单调接收时刻不作 UTC 显示）。"
  - "不可变帧租约与缓冲区所有权：实现 latest_frame(camera_id)->FrameLease，租约持有 GstSample/GstBuffer 共享所有权，释放回调在最后一个消费者退出后执行；按 caps 计算 planes 的 offset/stride_bytes/size_bytes 与 buffer_bytes，绝不向 core 或渲染层传已 unmap 的裸地址；空帧返回 NOT_READY。用户可观察：多消费者并发读取同一帧不发生 use-after-free，消费端退出后缓冲被正确释放，非 NV12/非法 stride 被显式拒绝。"
  - "librga NV12→BGR 格式转换：在取流 worker 内用 imcvtcolor(RK_FORMAT_YCbCr_420_SP→RK_FORMAT_BGR_888, IM_YUV_TO_RGB_BT601_FULL) 转换，按 caps 处理列/行 padding（ystride/uv_offset/hstride）与 MPP 输出对齐，接受 IM_STATUS_SUCCESS 与 IM_STATUS_NOERROR 两个成功码；不采用 rgaconvert 插件。用户可观察：转换后 BGR 三通道均值近似相等（可见光判据），带 padding 的 NV12 转换结果正确，转换失败时输出脱敏错误而不静默丢帧。"
  - "每路取流 worker 与状态机接入：每相机一个取流 worker，有限等待拉帧（单次 pull 默认≤200ms）、drain GstBus 的 ERROR/EOS/STATE_CHANGED、统计 fps/最近帧单调与墙钟时间/重连次数/质量标志，并驱动 core 六态机（首帧超时/冻结/重连退避/阈值升级）；渲染前必须经 may_present_as_live(now) 且租约属于当前 generation，非实时状态渲染占位与最近帧时间。用户可观察：断流后该路进入 FROZEN/RECONNECTING 并按阈值升级，恢复出帧后计数清零，非 LIVE 时旧帧不被当作实时画面。"
  - "多路并发与单路失败隔离：以六路独立取流 worker（或明确的有界工作池）并发推进，单路启动失败、断流或重建不影响其余五路，槽位顺序不变、不重启其他路；pump 不在 GUI 线程执行。用户可观察：断开其中一路后该路显示占位与最近帧时间，其余五路继续刷新，网格槽位不重排，六路并发时无相互阻塞。"
  - "三类消费者的有界队列与背压：为显示（latest-only 深 1）、推理（按 app.ai.queue_depth 的丢最旧有界队列）、录像（独立有界压缩分支）分别设置队列与丢帧/溢出策略并各自计数（display_dropped/ai_dropped/recording_overflow），保证 UI/AI 慢不阻塞取流，录像溢出记缺口。用户可观察：人为放慢显示或 AI 消费者时取流帧率不塌陷、各计数可观测，录像分支不被显示丢帧策略影响。"
  - "显示分发与纹理交接：向 GUI 提供按配置渲染路径（默认 cpu）的不可变帧快照与 presentable 状态；cpu 路径由渲染层消费媒体验证过的稳定视图或深拷贝上传纹理，gl 路径保留为可开启候选且在 qmlglsink 等依赖缺失时明确不可用；同一相机多视图复用同一来源，切页不另拉流、不重建会话。用户可观察：P1/P4/P5 共享同一帧来源，切换页面不触发取流重建，依赖缺失时 gl 路径显式报不可用而非静默降级。"
  - "AI 帧派发边界：按 ai_enabled/ai_profile 选择需要推理的相机，按 app.ai.inference_interval 降频向推理侧投递带 (session_id,generation,seq) 关联键的帧租约，队列有界且丢最旧并计数；左右两侧 ai_profile=none 永不进入推理队列；本任务只实现媒体侧派发接口，不实现模型推理。用户可观察：仅启用推理的相机有派发记录，队列溢出时丢最旧且计数增加，派发的帧身份可用于结果回联。"
  - "录像压缩分支与滚动缓冲：在解码前 tap 压缩包到独立有界滚动缓冲，按 clip_pre_seconds 保留最近压缩数据，缓冲按字节与时长双上限受控，且不使用显示/AI 的丢帧策略、不保存全部原始帧；录像来源策略遵循配置 recording_source 并在 NVR 未配置时回落本机保护片段。用户可观察：滚动缓冲在容量/时长上限内稳定运行，压缩分支与显示分支互不影响，NVR 未配置时来源状态显式呈现而非静默。"
  - "保护片段固化与缺口记录：按幂等键 request_id 处理 ClipRequest，固化 [trigger-pre, trigger+post)（默认 -30s/+60s）为保护片段，起点对齐关键帧解码依赖并回报 actual_t0/actual_t1 与请求窗口；写入采用临时文件→完成封装/校验→flush+fsync→rename→fsync 目录→事务发布，任何中断写 recording_gaps(camera,t0,t1,reason)；可用性区分完整/Incomplete/Unavailable，绝不以 .json 清单或空文件冒充录像。用户可观察：触发后产生可定位的真实媒体片段且时长与覆盖符合配置，相同 request_id 重复请求返回同一作业、不同参数返回 CONFLICT，中断处出现缺口且事件录像可用性如实标注。"
  - "录像 provider 与回放媒体链路：实现 querySegments/queryGaps/playSegment/exportSegment，带 request_id 与 deadline 并返回 ok|partial|unavailable|error 及稳定 reason；play/seek 回报实际解码 position 而非请求接受；以统一 UTC 时间轴驱动回放并将各路实际播放头用于同步；缩略图仅用媒体生成的可读引用。用户可观察：查询成功但无覆盖返回空列表而不称可播放，部分覆盖标 partial，NVR 未配置时返回 unavailable/UNCONFIGURED 且不生成模拟片段填补，导出返回实际路径/大小或失败。"
  - "异常恢复控制器：实现真实会话重建（置 NULL→释放→重建）并在退避到期后执行，每个实际尝试只计一次且保留失败链计数，恢复必须由真实新帧确认而非 PLAYING 返回值；AUTH_FAILED/CREDENTIAL_MISSING 不自动反复重试，FORMAT/UNSUPPORTED 仅在输入或模型能力变化后重试；ONVIF 看门狗作为受控可选能力默认关闭。用户可观察：断流后按退避重建并以新帧确认恢复，重连计数与实际尝试一致，鉴权失败不进入无限重试，单路重建不重启其他路。"
  - "时间基准与回放同步：实现启动 TimeBase.calibrate(wall,mono) 及单调↔UTC 换算，片段与事件统一 UTC 毫秒、单调用微秒且换算只做一次；回放按各路实际播放头统一 UTC 求 max−min，超过 replay_sync_threshold_ms（默认 300，可配）提示同步偏差，缺任一路有效时钟则 available=false；用户 seek 递增 request generation 并丢弃旧回调。用户可观察：未校准不得写 UTC 业务事件，同步超阈值出现显式提示，固定 offsets 不冒充真实播放头，定位未到达不提前显示已定位。"
  - "视频诊断、能力探测与结构化日志：为每路输出结构化指标（state/fps/最近帧单调与墙钟/重连次数/质量标志/display_dropped/ai_dropped/recording_overflow/gap_count/实际 attempt_id/last_error 脱敏）并按日滚动，能力探测使用直接 gst-inspect 且记录库/插件版本，凭据、含鉴权 URL 与 pipeline/bus 原文均不得进入日志、DB、工件或进程命令行。用户可观察：诊断输出可区分在线/未核验/缺口三态，错误消息整条脱敏，版本与元素能力可独立读取。"
  - "预算测量装置与三类源分层留证：实现可复用的埋点与计数器以支撑吞吐（源帧率/显示帧率/CPU/RSS/NPU/温度）、端到端延迟（到达→解码完成→转换完成→呈现的分位）、同步偏差、存储（实测 bitrate/片段实际大小/free bytes）与断流恢复耗时；对真实 RTSP、文件回放、模拟输入三类源分别产出可归档记录，不互相替代，也不把静态/主机结论当作真机结论。用户可观察：仪器可在有源环境产出逐项可归档结果，真实/文件/模拟证据分开标注，缺授权时如实记录为待执行而非通过。"
