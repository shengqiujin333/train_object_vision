# IVR Web API: https://www.eolink.com/share/index?shareCode=1da60b6a050be3c4674d10be2a6976c0
# Password stays in the process environment/private board credential file.
nvr:
  enabled: true
  address: "http://192.168.1.4"
  api_prefix: "/digest"
  username: nvradmin
  credential_env: TRAIN_NVR_CREDENTIAL
  timezone: Asia/Shanghai
  timestamp_mode: local
  response_channel_base: 1
  timeout_ms: 8000
  playback_transport: tcp
  playback_legacy_control: true
  # This NVR rejects frmGetRtspUrl Type 13; standard /recording RTSP is verified on site.
  playback_url_template: "rtsp://192.168.1.4:554/recording?ch={channel}&stream=0&start={start}&stop={stop}&rec_inquiry_type=0"
  # Verified against frmGetPreviewInfo camera IPs and actual recording queries.
  channels:
    - camera: CAM-01
      channel: 1
    - camera: CAM-02
      channel: 8
    - camera: CAM-03
      channel: 4
    - camera: CAM-04
      channel: 5
    - camera: CAM-05
      channel: 6
    - camera: CAM-06
      channel: 7
