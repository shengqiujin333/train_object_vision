# railhmi 应用配置（角色/模式/录像来源/存储/NVR 登记）
# 本期 mode=visible（红外未接入）；render_path 依 ITEM-002 板端实测选定 cpu。
app:
  language: "zh-CN"
  default_role: admin
  resolution: [1920, 1080]
  render_path: cpu
  mode: visible
  recording_source: both
  log_level: info
  simulation: false
  storage:
    retention_days: 7
    max_gb: 20
    low_threshold_pct: 10
  # NVR 已登记；protocol/channel_mapping 未提供 -> 界面按“未配置”呈现，不虚构通道号
  integrations:
    - id: NVR
      name: 网络录像机
      address: 192.168.1.4
      registered: true
  # 权限（交互 §8）：导出默认仅管理员；“true”时维护/研发也可导出（受配置）。
  permissions:
    export_ops_allowed: false
  # 推理调度（DESKTOP §8.2）：降频、有界丢旧帧队列、NPU 预算、温度守卫；模型版本按职责登记。
  ai:
    inference_interval: 5
    queue_depth: 2
    npu_budget: 4
    temp_limit_c: 85.0
    models:
      - profile: front
        name: yolov5s
        version: "rknn-2.3.2/yolov5s"
      - profile: wheel_rail
        name: yolov8s-seg
        version: "rknn-2.3.2/yolov8s-seg"
      - profile: pantograph
        name: yolov5s
        version: "rknn-2.3.2/yolov5s"
      - profile: cab_door
        name: yolov5s
        version: "rknn-2.3.2/yolov5s"
