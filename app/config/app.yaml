# railhmi 应用配置（角色/模式/录像来源/存储/NVR 登记）
# 本期 mode=visible（红外未接入）；render_path 依 ITEM-002 板端实测选定 cpu。
app:
  language: "zh-CN"
  default_role: admin
  # 设计/回退分辨率：默认运行时跟随物理屏幕全屏自适应，此值在 --windowed /
  # RAILHMI_WINDOWED=1 或无窗口系统时生效。换屏只需改这里（或保持 auto）。
  # 当前实机 HDMI 首选模式为 1280x800 @60Hz（10.1" 16:10）。
  resolution: [1280, 800]
  render_path: cpu
  mode: visible
  recording_source: both
  log_level: info
  simulation: false
  storage:
    retention_days: 7
    max_gb: 20
    low_threshold_pct: 10
  # NVR 已登记；protocol/channel_mapping 未提供 -> 界面按“未配置”呈现，不虚构通道号
  integrations:
    - id: NVR
      name: 网络录像机
      address: 192.168.1.4
      registered: true
  # 权限（交互 §8）：导出默认仅管理员；“true”时维护/研发也可导出（受配置）。
  permissions:
    export_ops_allowed: false
  # 推理调度（DESKTOP §8.2）：降频、有界丢旧帧队列、NPU 预算、温度守卫；模型版本按职责登记。
  # 2026-11-17：视觉推理已接入主程序（AiRuntime + media::VisionAiWorker）。
  # 车前方/受电弓/轮轨当前**共用同一个检测模型**（现场要求，将来按职责换专用模型只改这里）；
  # 车前方另用分割模型做「轨道掩码 ∩ 人/物」两阶段判定（命中即在轨道区域内 -> 一级报警）。
  ai:
    inference_interval: 5
    queue_depth: 2
    npu_budget: 4
    temp_limit_c: 85.0
    # 模型目录：相对路径按 --config 目录解析。板端为 rknn_model_zoo 安装目录。
    models_dir: "/home/admin/rknn_model_zoo/install/rk3588_linux_aarch64/rknn_yolov8_seg_demo/model"
    # 临时能力复用：受电弓/轮轨暂无专用模型，先用与车前方相同的检测模型跑通链路。
    # false 时恢复「无专用模型即不可用」的严格语义。
    reuse_detect_for_duties: true
    models:
      - profile: front
        name: yolov5s
        version: "rknn-2.3.2/yolov5s"
      - profile: front
        name: yolov8s-seg
        version: "rknn-2.3.2/yolov8s-seg"
      - profile: pantograph
        name: yolov5s
        version: "临时复用/rknn-2.3.2/yolov5s"
      - profile: wheel_rail
        name: yolov5s
        version: "临时复用/rknn-2.3.2/yolov5s"
    # P5「AI 调试」可现场替换的模型清单（kind 由名称推断：含 seg = 分割，其余 = 检测）。
    catalog:
      - name: yolov5s
        version: "rknn-2.3.2/yolov5s"
      - name: yolov8s-seg
        version: "rknn-2.3.2/yolov8s-seg"
  # BLE 门磁（USTONE BWD1 / USTONE-HA-BSM1，广播方式，无配对/GATT 连接）。
  # 协议：31 字节广播，byte0=0x07、byte1..4=设备ID(小端)、byte5..30=<Key,Value>；
  #       Key 0x08 门磁(1B，1=感应不到磁铁→未关严)、Key 0x63 电池百分比(2B 小端)。
  # 使用说明：nRF Connect 搜到名称 T1 即设备进入工作状态。
  # 本配置节整体可选：删除即保持 enabled=false，界面如实显示「未接入」。
  door_sensor:
    enabled: true
    auto_discover: true          # 允许按广播名发现；仍受 name_filter 闸门约束
    name_filter: "T1"            # 仅该名称（或前缀）或已登记 MAC 才会被当作门磁
    # adapter: hci0              # 缺省自动选第一个 org.bluez.Adapter1
    # 11-16 现场确认：厂家标称广播 1s 一次；root btmon 关掉控制器去重后
    # 45s 内实测约 20 个广播事件（1~7s，多数 1~5s）。原「最多每 10s 读一次」
    # 约束已按业主要求放宽：全量 GetManagedObjects 改为 1s 一次，及时读到
    # BlueZ 缓存里的最新门状态；PropertiesChanged 事件仍保留更快的即时路径。
    # 独立 I/O 线程每次轮询同时下发 HCI filter_dup=0，抵消 bluetoothd 约每
    # 10s 重启扫描时重新打开的内核去重；无 CAP_NET_ADMIN/CAP_NET_RAW 时
    # 只告警并优雅降级，不假装去重已关闭。配置上限仍为 10000ms（可退回原节奏）。
    poll_interval_ms: 1000
    stale_ms: 60000              # 超过该时长未见广播变化→STALE/不可用（厂商未标广播周期）
    battery_low_pct: 20
    payload_offset: 0            # 0=自动在前 4 字节内定位 0x07（兼容厂商 ID 前缀）
    # 已登记 MAC 才是权威来源。现场拿到实际 MAC 后按下面格式填入（说明书截图里的
    # D1:D9:DE:FE:92:8B 只是示例，未登记为该设备，绝不预置）。
    devices: []
